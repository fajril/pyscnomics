[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscnomics"
version = "1.4.0"
dependencies = [
    "numpy==1.26.2",
    "dateutils>=0.6.12",
    "matplotlib>=3.4.3",
    "pandas>=2.2.0",
    "pyxirr==0.9.3",
    "scipy >=1.7.3",
    "click==8.1.7",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "fastapi>=0.116.0",
    "starlette>=1.0.1",
    "pathos==0.3.3",
]
requires-python = ">=3.11"
authors = [
    {name = "Aditya Dewanto", email = "adityadewanto@gmail.com"},
    {name = "Muhammad Adhim Mulia", email = "adhimmuliam@gmail.com"},
    {name = "Fajril Ambia", email = "fambia@skkmigas.go.id"},
    {name = "Iskandar Fahmi", email = "ifahmi@bpma.go.id"},
    {name = "Zuher Syihab", email = "zuher.syihab@itb.ac.id"},
    {name = "Sudono", email = "sudono@gmail.com"},
]
description = "An economic engine for calculating PSC Scheme in Indonesia."
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["Production Sharing Contract", "PSC", "Project Economic"]
classifiers = [
    "Programming Language :: Python"
]

[project.urls]
Homepage = "https://github.com/fajril/pyscnomics"
Documentation = "https://github.com/fajril/pyscnomics"

[project.scripts]
pyscnomics = "pyscnomics.pyscnomics_cli:entry_point"

[project.optional-dependencies]
dev = [
    "pytest>=7.1.2",
    "httpx>=0.27.0",
]
docs = [
    "sphinx>=5.0",
    "furo",
    "sphinxcontrib-mermaid",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pyscnomics" = ["**/*.json"]